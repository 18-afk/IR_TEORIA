<title>Guía IR: enlaces, vibraciones y compuestos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700&display=swap">
<style>
:root{--bg:#F8F9FA;--cd:#fff;--tx:#343A40;--mu:#6c757d;--ln:#dee2e6;--pr:#007BFF;--ok:#28A745;--ac:#FFC107;--dg:#DC3545;--in:#17A2B8;--nv:#343A40;--hl:#e7f1ff;--wr:#fff8e1;--wt:#6b5200;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#212529;--cd:#2b3035;--tx:#e9ecef;--mu:#adb5bd;--ln:#444b52;--pr:#5aa9ff;--hl:#1c3350;--wr:#3a3012;--wt:#f0d98a}}
:root[data-theme="dark"]{--bg:#212529;--cd:#2b3035;--tx:#e9ecef;--mu:#adb5bd;--ln:#444b52;--pr:#5aa9ff;--hl:#1c3350;--wr:#3a3012;--wt:#f0d98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Lato,system-ui,"Segoe UI",Arial,sans-serif}
header{background:var(--nv);color:#F8F9FA;position:sticky;top:0;z-index:100;padding-top:env(safe-area-inset-top,0px)}
.in{max-width:1280px;margin:0 auto;padding:0 1.5rem}
header h1{font-size:1.25rem;margin:0;padding:12px 0 2px;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:#ced4da;font:500 .95rem Lato,sans-serif;padding:10px 12px;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--ac);font-weight:700}
main{padding:20px 0 56px}
.hero{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
input[type=search]{width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:4px;background:var(--cd);color:var(--tx)}
input:focus,button:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chips button{font:500 .875rem Lato,sans-serif;background:var(--cd);color:var(--tx);border:1.5px solid var(--ln);border-radius:4px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--pr);border-color:var(--pr);color:#F8F9FA}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:14px;animation:up .48s ease-out both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.r{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:700}.rg{font-weight:700;color:var(--pr);white-space:nowrap;font-variant-numeric:tabular-nums}
.mt{color:var(--mu);font-size:.875rem}
.tg{display:inline-block;font-size:.75rem;font-weight:500;border:1px solid var(--ln);border-radius:4px;padding:0 8px;margin:6px 6px 0 0;color:var(--mu)}
.tg.v{border-color:var(--in);color:var(--in)}
svg.ms{width:100%;height:auto;display:block;margin-top:8px;background:var(--bg);border-radius:4px}
.band{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:6px;border-top:1px solid var(--ln)}
.band.hit{background:var(--hl)}.wn{font-weight:700;color:var(--pr);font-variant-numeric:tabular-nums}
.note{background:var(--wr);color:var(--wt);border-radius:4px;padding:8px 10px;font-size:.875rem;margin-top:8px}
img.sp{width:100%;height:auto;border-radius:4px;border:1px solid var(--ln);background:#fff}
.cap{font-size:.8rem;color:var(--mu);margin:8px 0 2px}
.vib circle.h{fill:var(--pr)}.vib circle.c{fill:var(--ac)}.vib line{stroke:var(--tx);stroke-width:3}.vib text{fill:var(--tx);font:700 13px Lato,sans-serif}
.cnt{color:var(--mu);font-size:.875rem;margin:0 0 8px}
h2{font-size:1.25rem;margin:20px 0 6px}li{margin:4px 0}.hid{display:none}
.mast{background:var(--cd);border:1px solid var(--ln);border-radius:4px;padding:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.06)}.mast svg{width:100%;height:auto;display:block}.mast .mt{margin-top:4px}
.grp{display:flex;align-items:center;gap:8px;font-size:1.05rem;margin:20px 0 4px}.grp i{width:12px;height:12px;border-radius:2px;display:inline-block}
.row{display:grid;grid-template-columns:1fr auto 110px;gap:10px;align-items:center;width:100%;text-align:left;background:var(--cd);border:1px solid var(--ln);border-left:4px solid var(--gc);border-radius:4px;padding:8px 10px;margin:6px 0;font:inherit;color:var(--tx);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06)}.row.sel{background:var(--hl);border-color:var(--pr);border-left-color:var(--gc)}.row svg{width:110px;height:34px}.row .nm{font-size:.95rem}
details{margin:6px 0}summary{cursor:pointer;color:var(--mu);font-size:.875rem;padding:4px 0}
@media (max-width:520px){.row{grid-template-columns:1fr 96px}.row .rg{grid-column:1;grid-row:2}.row svg{width:96px;grid-row:1/3;grid-column:2}}
@media (prefers-reduced-motion:reduce){.card{animation:none;transition:none}.vib animate{display:none}}
</style></head><body>

const EXTRA=["Flexión tipo paraguas del CH₃: el metilo se abre y se cierra, banda de ~1375.","Respiración del anillo: el anillo aromático se expande y se contrae completo.","Sobretonos y bandas de combinación: son débiles, como las de 2000–1665 de los aromáticos.","Resonancia de Fermi: un sobretono se mezcla con una fundamental; causa el doblete del C–H de aldehído."];
const ESP=["Tu espectro: bandas débiles de amida y una banda intensa en 1738 que no es típica del acetaminofén (posible excipiente o contaminación).","Tu espectro: O–H fenólico en ~3234 y anillo aromático, pero casi no se ve el C=O de ~1660. Confirma la muestra o repite con buen contacto en el ATR.","Tu espectro coincide con lo esperado.","Tu espectro coincide: par de C=O en ~1697 y ~1655, sin O–H ni N–H.","Tu espectro: las bandas hacia arriba (1738, 1366, 3451) son artefactos; el CO₂ de 2323 no se reporta."];
const ZN=["amida I y II (1700–1480)","O–H y C–H (3500–2800)","O–H (3700–2900)","C=O (1760–1600)","C=O y artefacto (1800–1600)"];
const ORD=[0,1,2,3,4];
let tab="e",grp="ALL";const $=i=>document.getElementById(i);
const n$=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const rg=(a,b)=>a===b?""+a:Math.max(a,b)+"–"+Math.min(a,b);
function match(lo,hi,q){if(!/^[\d.,\s]+$/.test(q))return null;const x=parseFloat(q.replace(",","."));if(isNaN(x))return null;return x>=Math.min(lo,hi)-15&&x<=Math.max(lo,hi)+15}
const X=w=>8+(4000-w)/3500*284;
function mini(lo,hi,it){const c=(lo+hi)/2,s=Math.max(7,(hi-lo)/2.6),dp=/muy fuerte/.test(it)?.92:/fuerte/.test(it)?.78:/media/.test(it)?.52:.3;let d="";for(let w=4000;w>=500;w-=5){const y=6+46*dp*Math.exp(-((w-c)**2)/(2*s*s));d+=(w==4000?"M":"L")+X(w).toFixed(1)+","+y.toFixed(1)}
return `<svg class="ms" viewBox="0 0 300 70" role="img" aria-label="Esquema de la señal"><rect x="${X(Math.max(lo,hi)).toFixed(1)}" y="2" width="${Math.max(3,X(Math.min(lo,hi))-X(Math.max(lo,hi))).toFixed(1)}" height="54" fill="var(--pr)" opacity=".13"/><path d="${d}" fill="none" stroke="var(--pr)" stroke-width="1.6"/><line x1="8" y1="58" x2="292" y2="58" stroke="var(--ln)"/><text x="8" y="68" font-size="8" fill="var(--mu)">4000</text><text x="150" y="68" font-size="8" fill="var(--mu)" text-anchor="middle">2000 cm⁻¹ · esquema</text><text x="292" y="68" font-size="8" fill="var(--mu)" text-anchor="end">500</text></svg>`}
function crop(i){const c=CROP[i];return `<svg class="ms" viewBox="0 0 300 80" role="img" aria-label="Zona de tu espectro"><path d="${c.d}" transform="translate(0,2)" fill="none" stroke="var(--tx)" stroke-width="1.2"/><line x1="8" y1="72" x2="292" y2="72" stroke="var(--ln)"/><text x="8" y="80" font-size="8" fill="var(--mu)">${c.hi}</text><text x="292" y="80" font-size="8" fill="var(--mu)" text-anchor="end">${c.lo} cm⁻¹</text></svg>`}
function vib(k){const A=(id,ax,ay,vals,r)=>`<circle class="h" id="${id}" cx="${ax}" cy="${ay}" r="${r||8}"><animate attributeName="cx" dur="1.6s" repeatCount="indefinite" values="${vals[0]}"/><animate attributeName="cy" dur="1.6s" repeatCount="indefinite" values="${vals[1]}"/>${vals[2]?`<animate attributeName="r" dur="1.6s" repeatCount="indefinite" values="${vals[2]}"/>`:""}</circle>`;
const L=(x2,y2,v)=>`<line x1="60" y1="62" x2="${x2}" y2="${y2}"><animate attributeName="x2" dur="1.6s" repeatCount="indefinite" values="${v[0]}"/><animate attributeName="y2" dur="1.6s" repeatCount="indefinite" values="${v[1]}"/></line>`;
const P={
sim:[["35;29;35;29;35","25;19;25;19;25"],["85;91;85;91;85","25;19;25;19;25"]],
asi:[["35;29;35;41;35","25;19;25;31;25"],["85;79;85;91;85","25;31;25;19;25"]],
tij:[["35;43;35;27;35","25;26;25;24;25"],["85;77;85;93;85","25;26;25;24;25"]],
bal:[["35;43;35;27;35","25;28;25;22;25"],["85;93;85;77;85","25;22;25;28;25"]],
ale:[["35","25"],["85","25"]],tor:[["35","25"],["85","25"]]}[k];
const rl=k=="ale"?"8;12;8;4;8":k=="tor"?"8;12;8;4;8":null,rr=k=="ale"?"8;12;8;4;8":k=="tor"?"8;4;8;12;8":null;
const sg=k=="ale"?["+","+"]:k=="tor"?["+","−"]:null;
return `<svg class="vib" viewBox="0 0 120 90" role="img" aria-label="${k}">${L(35,25,P[0])}${L(85,25,P[1])}<circle class="c" cx="60" cy="62" r="11"/>${A("a",35,25,[P[0][0],P[0][1],rl])}${A("b",85,25,[P[1][0],P[1][1],rr])}${sg?`<text x="30" y="14">${sg[0]}</text><text x="86" y="14">${sg[1]}</text>`:""}</svg>`}
function nav(){$("nav").innerHTML=[["e","Enlaces"],["v","Vibraciones"],["c","Compuestos"],["f","Fuentes"]].map(([k,l])=>`<button class="${tab==k?"on":""}" data-t="${k}">${l}</button>`).join("");
$("hero").className=(tab=="e"||tab=="c")?"hero":"hid";$("chips").className=tab=="e"?"chips":"hid";
$("chips").innerHTML=[["ALL","Todos"],...Object.entries(G)].map(([k,l])=>`<button class="${grp==k?"on":""}" data-g="${k}">${l}</button>`).join("")}
let sel=-1;const GC={XH:"var(--pr)",TR:"var(--in)",CO:"var(--ok)",DB:"var(--ac)",FP:"var(--mu)"};
const KEY=/^(O–H|N–H|=C–H|C–H alifático|C=O|C=C aromático|C–O alcohol)/;
function pk(r){const n=r[1],c=(r[3]+r[4])/2,w=r[4]-r[3];
if(/ácido carboxílico/.test(n)&&r[2]=="estiramiento")return[[c,w/2.6,.8],[2960,9,.3],[2870,9,.25]];
if(/N–H amina/.test(n)&&r[2]=="estiramiento")return[[3430,8,.35],[3350,8,.3]];
if(/aromático \(anillo\)/.test(n))return[[1600,9,.45],[1580,8,.3],[1500,9,.55],[1455,9,.4]];
if(/Sobretonos/.test(n))return[[1900,14,.2],[1830,12,.25],[1770,12,.2],[1700,12,.15]];
if(/alifático/.test(n))return[[2960,9,.55],[2925,9,.6],[2870,9,.45],[2850,8,.45]];
const d=/muy fuerte/.test(r[5])?.92:/fuerte/.test(r[5])?.78:/media/.test(r[5])?.52:.3;return[[c,Math.max(7,w/2.6),d]]}
function curve(ps,fx,y0,am,st){let d="";for(let w=4000;w>=500;w-=st){let s=0;for(const[c,sg,dp]of ps)s+=dp*Math.exp(-((w-c)**2)/(2*sg*sg));d+=(w==4000?"M":"L")+fx(w).toFixed(1)+","+(y0+am*Math.min(1,s)).toFixed(1)}return d}
function drawE(rows,q){const fm=w=>10+(4000-w)/3500*580,fr=w=>4+(4000-w)/3500*102,gs=Object.keys(G);
const all=[];rows.forEach(r=>all.push(...pk(r)));
let m=`<svg viewBox="0 0 600 152" role="img" aria-label="Mapa del espectro">`;
for(const w of[4000,3000,2000,1000,500])m+=`<line x1="${fm(w)}" y1="4" x2="${fm(w)}" y2="140" stroke="var(--ln)"/><text x="${fm(w)}" y="150" font-size="9" fill="var(--mu)" text-anchor="${w==4000?"start":w==500?"end":"middle"}">${w}</text>`;
m+=`<path d="${curve(all,fm,6,60,6)}" fill="none" stroke="var(--tx)" stroke-width="1.3" opacity=".75"/>`;
const sr=sel>=0?B[sel]:null;
if(sr)m+=`<rect x="${fm(Math.max(sr[3],sr[4]))}" y="4" width="${Math.max(3,fm(Math.min(sr[3],sr[4]))-fm(Math.max(sr[3],sr[4])))}" height="134" fill="var(--pr)" opacity=".16"/>`;
rows.forEach(r=>{const i=B.indexOf(r),y=76+gs.indexOf(r[0])*12,x=fm(Math.max(r[3],r[4])),wd=Math.max(2.5,fm(Math.min(r[3],r[4]))-x);m+=`<rect x="${x.toFixed(1)}" y="${y}" width="${wd.toFixed(1)}" height="8" rx="1.5" fill="${GC[r[0]]}" opacity="${i==sel?1:.5}" ${i==sel?'stroke="var(--tx)"':''}/>`});
const x0=parseFloat(q.replace(",","."));if(/^[\d.,\s]+$/.test(q)&&!isNaN(x0)&&x0>=500&&x0<=4000)m+=`<line x1="${fm(x0)}" y1="4" x2="${fm(x0)}" y2="140" stroke="var(--dg)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${Math.min(560,fm(x0)+3)}" y="12" font-size="10" fill="var(--dg)">${x0}</text>`;
m+=`</svg><div class="mt">${sr?"Seleccionado: <b>"+sr[1]+"</b> ("+rg(sr[3],sr[4])+" cm⁻¹). ":""}Cada barra de color es un enlace, por región; toca una fila para ubicarlo. Esquema, no espectro real.</div>`;
const row=r=>{const i=B.indexOf(r),p=pk(r);return `<button class="row ${i==sel?"sel":""}" data-r="${i}" style="--gc:${GC[r[0]]}"><div><div class="nm">${r[1]}</div><div class="mt">${r[2]} · ${r[5]}${i==sel&&r[6]?" · "+r[6]:""}</div></div><div class="rg">${rg(r[3],r[4])} cm⁻¹</div><svg viewBox="0 0 110 34" aria-hidden="true"><path d="${curve(p,fr,3,26,5)}" fill="none" stroke="${GC[r[0]]}" stroke-width="1.6"/><line x1="4" y1="31" x2="106" y2="31" stroke="var(--ln)"/></svg></button>`};
let h=`<div class="mast">${m}</div><p class="cnt" style="margin-top:10px">${rows.length} resultado(s)</p>`;
gs.forEach(g=>{const rs=rows.filter(r=>r[0]==g);if(!rs.length)return;const k=rs.filter(r=>KEY.test(r[1])),o=rs.filter(r=>!KEY.test(r[1]));
h+=`<div class="grp"><i style="background:${GC[g]}"></i><b>${G[g]}</b></div>`+k.map(row).join("");
if(o.length)h+=`<details ${q||k.length==0?"open":""}><summary>Menos comunes (${o.length})</summary>${o.map(row).join("")}</details>`});
return h}
function draw(){const q=$("q").value.trim(),nq=n$(q);let h="";
if(tab=="e"){const rows=B.filter(r=>{if(grp!="ALL"&&r[0]!=grp)return false;if(!q)return true;const m=match(r[3],r[4],q);return m!==null?m:n$(r.slice(1).join(" ")).includes(nq)});
h=drawE(rows,q);const _x=[].map((r,i)=>`<div class="card" style="animation-delay:${Math.min(i,10)*40}ms"><div class="r"><div class="nm">${r[1]}</div><div class="rg">${rg(r[3],r[4])} cm⁻¹</div></div><span class="tg v">${r[2]}</span><span class="tg">${r[5]}</span>${r[6]?`<div class="mt">${r[6]}</div>`:""}${mini(r[3],r[4],r[5])}</div>`).join("")+"</div>"}
else if(tab=="v"){h=`<p class="cnt">Ejemplo con un grupo CH₂. Estiramiento (E) cambia la longitud del enlace; flexión (F) cambia el ángulo. Dibujos esquemáticos.</p><div class="grid">`+V.map((v,i)=>`<div class="card" style="animation-delay:${i*100}ms">${vib(v.k)}<div class="nm">${v.n}</div><span class="tg v">${v.t}</span><div class="mt">${v.d}</div><div class="mt"><b>En IR:</b> ${v.ir}</div></div>`).join("")+`</div><h2>Otras que verás en los libros</h2><ul>${EXTRA.map(s=>`<li>${s}</li>`).join("")}</ul><div class="note"><b>Regla:</b> solo se ven en IR las vibraciones que cambian el momento dipolar. Por eso el C=O (muy polar) sale fuerte y un C≡C simétrico a veces ni aparece.</div>`}
else if(tab=="c"){const cs=C.map((c,i)=>[c,i]).filter(([c])=>{if(!q)return true;return c.b.some(b=>{const k=match(b[0],b[1],q);return k!==null?k:n$(b[2]+" "+c.n+" "+c.f).includes(nq)})||n$(c.n+" "+c.t).includes(nq)});
h=`<div class="grid">`+cs.map(([c,i],j)=>`<div class="card" style="animation-delay:${j*100}ms"><div class="r"><div class="nm">${c.n}</div><div class="mt">${c.f}</div></div><p class="cap">Tu espectro con las marcas (ATR, %T)</p><img class="sp" loading="lazy" src="${IMG[i]}" alt="Espectro IR de ${c.n}"><p class="cap">Zona clave de tu espectro: ${ZN[i]}</p>${crop(i)}<div class="note">${ESP[i]}</div>${c.b.map(b=>{const k=q&&match(b[0],b[1],q);return `<div class="band ${k?"hit":""}"><div class="wn">${rg(b[0],b[1])}</div><div>${b[2]}<div class="mt">${b[3]}</div></div></div>`}).join("")}<div class="note">${c.t}</div></div>`).join("")+`</div>`||'<p class="cnt">Sin resultados.</p>'}
else{h=`<div class="card"><h2 style="margin-top:0">Libros base</h2><ul>${FUENTES.slice(0,3).map(s=>`<li>${s}</li>`).join("")}</ul><h2>Tablas y artículos cotejados</h2><ul>${FUENTES.slice(3).map(s=>`<li>${s}</li>`).join("")}</ul><div class="note">Los rangos son valores típicos: la posición exacta cambia con el estado físico, los puentes de hidrógeno, la conjugación y la técnica (en ATR las bandas se corren unos cm⁻¹). Los dibujos de señales y vibraciones son esquemas, no espectros de referencia. Verifica cada valor en tu libro antes de reportar.</div></div>`}
$("out").innerHTML=h}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;if(t.dataset.t){tab=t.dataset.t;grp="ALL"}if(t.dataset.g)grp=t.dataset.g;if(t.dataset.r!==undefined)sel=sel==+t.dataset.r?-1:+t.dataset.r;nav();draw()});
$("q").addEventListener("input",draw);nav();draw();
</script></body></html>
